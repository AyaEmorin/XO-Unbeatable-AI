<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XO Docs — Markdown Reader</title>
  <meta name="description" content="Documentation viewer for the XO Tic-Tac-Toe project. Read system docs, PRD, and more with a beautiful dark-mode interface." />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════
       DESIGN TOKENS
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg-body: #0a0e1a;
      --bg-surface: #111827;
      --bg-card: rgba(17, 24, 39, 0.88);
      --bg-code: #0d1224;
      --bg-inline-code: rgba(99, 102, 241, 0.12);
      --bg-table-row: rgba(99, 102, 241, 0.04);
      --bg-table-head: rgba(99, 102, 241, 0.08);
      --bg-blockquote: rgba(99, 102, 241, 0.05);
      --bg-hover: rgba(99, 102, 241, 0.06);
      --bg-sidebar: rgba(8, 11, 22, 0.97);
      --border-glass: rgba(99, 102, 241, 0.15);
      --border-subtle: rgba(99, 102, 241, 0.08);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-heading: #f1f5f9;
      --accent: #818cf8;
      --accent-dim: rgba(129, 140, 248, 0.15);
      --cyan: #00f5d4;
      --pink: #f72585;
      --blue: #3d5afe;
      --purple: #a78bfa;
      --yellow: #fbbf24;
      --green: #34d399;
      --orange: #fb923c;
      --red: #f87171;
      --sidebar-w: 290px;
      --topbar-h: 52px;
    }

    /* ═══════════════════════════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 15% 10%, rgba(61,90,254,.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 90%, rgba(247,37,133,.04) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,245,212,.025) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,.18); border-radius: 9px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,.35); }
    ::selection { background: rgba(99,102,241,.3); }
    a { color: var(--accent); text-decoration: none; }

    /* ═══════════════════════════════════════════════════════════════
       LAYOUT
       ═══════════════════════════════════════════════════════════════ */
    #app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-glass);
      display: flex; flex-direction: column;
      z-index: 200;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    #sidebar.closed { transform: translateX(-100%); }

    .sidebar-brand {
      padding: 1.1rem 1.25rem .85rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: .65rem;
      flex-shrink: 0;
    }
    .sidebar-brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-radius: .55rem; display: flex; align-items: center; justify-content: center;
      font-size: .95rem; box-shadow: 0 2px 10px rgba(61,90,254,.3);
    }
    .sidebar-brand h1 {
      font-size: .95rem; font-weight: 800; color: var(--text-heading);
      letter-spacing: -.01em;
    }
    .sidebar-brand h1 span { color: var(--accent); font-weight: 400; font-size: .8rem; margin-left: .3rem; }

    .sidebar-section {
      padding: .8rem .65rem .4rem;
    }
    .sidebar-section-title {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .12em; color: var(--text-muted);
      padding: 0 .6rem .5rem; user-select: none;
    }

    /* Doc List */
    .doc-list { list-style: none; }
    .doc-item {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem .7rem; margin: 1px 0;
      border-radius: .5rem; cursor: pointer;
      font-size: .82rem; color: var(--text-secondary);
      transition: all .12s ease; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .doc-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .doc-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
    .doc-item-icon { font-size: .9rem; flex-shrink: 0; width: 1.3rem; text-align: center; }
    .doc-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* TOC */
    .toc-scroll {
      flex: 1; overflow-y: auto; padding-bottom: 1.5rem;
    }
    #toc-list { list-style: none; padding: 0 .5rem; }
    #toc-list li { margin: 0; }
    #toc-list a {
      display: block; padding: .3rem .65rem;
      font-size: .78rem; color: var(--text-muted);
      border-radius: .4rem; transition: all .12s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-decoration: none; line-height: 1.5;
    }
    #toc-list a:hover { background: var(--bg-hover); color: var(--text-secondary); }
    #toc-list a.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
    #toc-list a[data-level="1"] { font-weight: 700; color: var(--text-secondary); padding-left: .65rem; }
    #toc-list a[data-level="2"] { padding-left: .65rem; font-weight: 600; color: var(--text-secondary); }
    #toc-list a[data-level="3"] { padding-left: 1.6rem; }
    #toc-list a[data-level="4"] { padding-left: 2.5rem; font-size: .74rem; }

    /* Sidebar bottom */
    .sidebar-footer {
      padding: .75rem; border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .sidebar-drop-hint {
      display: flex; align-items: center; justify-content: center; gap: .4rem;
      padding: .6rem; border: 1px dashed rgba(99,102,241,.2); border-radius: .6rem;
      font-size: .72rem; color: var(--text-muted); cursor: pointer;
      transition: all .15s; text-align: center;
    }
    .sidebar-drop-hint:hover { border-color: var(--accent); color: var(--text-secondary); background: var(--bg-hover); }

    /* ── Top Bar ── */
    #topbar {
      position: fixed; top: 0; right: 0;
      left: var(--sidebar-w); height: var(--topbar-h);
      background: rgba(10,14,26,.88);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.25rem; z-index: 150;
      transition: left .28s cubic-bezier(.4,0,.2,1);
    }
    #topbar.full { left: 0; }

    .topbar-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }
    .topbar-right { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }

    .icon-btn {
      width: 34px; height: 34px;
      border: 1px solid var(--border-glass); border-radius: .45rem;
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s; font-size: 1rem; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent); }

    #current-file {
      font-size: .82rem; color: var(--text-secondary); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .pill-btn {
      padding: .35rem .9rem; border: 1px solid var(--border-glass);
      border-radius: 9999px; background: transparent;
      color: var(--text-secondary); font-size: .75rem; font-weight: 600;
      cursor: pointer; transition: all .15s; font-family: inherit;
      display: flex; align-items: center; gap: .35rem; white-space: nowrap;
    }
    .pill-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent); }
    .pill-btn-accent {
      background: linear-gradient(135deg, rgba(61,90,254,.18), rgba(109,40,217,.18));
      border-color: rgba(99,102,241,.3); color: var(--accent);
    }
    .pill-btn-accent:hover {
      background: linear-gradient(135deg, rgba(61,90,254,.32), rgba(109,40,217,.32));
      box-shadow: 0 0 18px rgba(61,90,254,.18);
    }

    /* ── Main ── */
    #main {
      flex: 1; margin-left: var(--sidebar-w);
      padding: calc(var(--topbar-h) + 1.5rem) 2.5rem 4rem;
      max-width: calc(var(--sidebar-w) + 860px + 5rem);
      transition: margin-left .28s cubic-bezier(.4,0,.2,1);
    }
    #main.full { margin-left: 0; display: flex; flex-direction: column; align-items: center; max-width: 100%; }
    #main.full #md-output, #main.full #welcome { max-width: 840px; width: 100%; }

    /* ── Welcome ── */
    #welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: calc(100vh - var(--topbar-h) - 6rem);
      text-align: center; animation: fadeIn .5s ease both;
    }
    .welcome-logo {
      font-size: 3.2rem; margin-bottom: .5rem;
      filter: drop-shadow(0 0 20px rgba(61,90,254,.3));
    }
    .welcome-title {
      font-size: 2rem; font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), var(--accent), var(--pink));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -.02em; margin-bottom: .25rem;
    }
    .welcome-sub { font-size: .85rem; color: var(--text-muted); margin-bottom: 2rem; letter-spacing: .05em; }

    .drop-card {
      width: min(440px, 88vw); padding: 3rem 2rem;
      border: 2px dashed rgba(99,102,241,.2); border-radius: 1.25rem;
      background: rgba(99,102,241,.04); cursor: pointer;
      transition: all .25s;
    }
    .drop-card:hover, .drop-card.dragover {
      border-color: var(--accent); background: rgba(99,102,241,.1);
      box-shadow: 0 0 40px rgba(99,102,241,.1); transform: translateY(-2px);
    }
    .drop-card-icon { font-size: 2.5rem; margin-bottom: .75rem; display: block; }
    .drop-card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-heading); margin-bottom: .4rem; }
    .drop-card-hint { font-size: .82rem; color: var(--text-muted); line-height: 1.7; }
    .drop-card-hint kbd {
      display: inline-block; padding: .1rem .4rem;
      background: rgba(99,102,241,.1); border: 1px solid var(--border-glass);
      border-radius: .3rem; font-family: 'JetBrains Mono', monospace;
      font-size: .7rem; color: var(--accent);
    }

    .loading-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--accent), var(--pink));
      z-index: 999; animation: loadSlide 1.2s ease infinite;
      display: none;
    }
    .loading-bar.show { display: block; }

    /* ═══════════════════════════════════════════════════════════════
       MARKDOWN STYLES
       ═══════════════════════════════════════════════════════════════ */
    #md-output { display: none; animation: slideUp .35s ease both; }

    /* Headings */
    #md-output h1 {
      font-size: 1.85rem; font-weight: 900; color: var(--text-heading);
      margin: 2.5rem 0 .9rem; padding-bottom: .55rem;
      border-bottom: 2px solid var(--border-glass); line-height: 1.3;
      letter-spacing: -.02em;
    }
    #md-output h1:first-child { margin-top: 0; }
    #md-output h2 {
      font-size: 1.4rem; font-weight: 800; color: var(--text-heading);
      margin: 2.2rem 0 .75rem; padding-bottom: .35rem;
      border-bottom: 1px solid var(--border-subtle); line-height: 1.35;
    }
    #md-output h3 { font-size: 1.15rem; font-weight: 700; color: var(--accent); margin: 1.8rem 0 .55rem; }
    #md-output h4 { font-size: 1rem; font-weight: 600; color: var(--purple); margin: 1.5rem 0 .45rem; }
    #md-output h5, #md-output h6 { font-size: .92rem; font-weight: 600; color: var(--text-secondary); margin: 1.2rem 0 .4rem; }

    .h-anchor {
      color: var(--text-muted); margin-left: .35rem; opacity: 0;
      transition: opacity .12s; font-weight: 400; text-decoration: none;
    }
    h1:hover .h-anchor, h2:hover .h-anchor, h3:hover .h-anchor, h4:hover .h-anchor { opacity: .5; }

    /* Text */
    #md-output p { margin: .7rem 0; line-height: 1.8; }
    #md-output strong { color: var(--text-heading); font-weight: 700; }
    #md-output em { color: var(--purple); }
    #md-output del { opacity: .5; }
    #md-output a { border-bottom: 1px solid rgba(129,140,248,.25); transition: all .12s; }
    #md-output a:hover { color: var(--cyan); border-color: var(--cyan); }
    #md-output hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--border-glass), transparent); margin: 2.5rem 0; }

    /* Lists */
    #md-output ul, #md-output ol { margin: .7rem 0; padding-left: 1.65rem; }
    #md-output li { margin: .25rem 0; line-height: 1.75; }
    #md-output li::marker { color: var(--accent); }
    #md-output input[type="checkbox"] { margin-right: .45rem; accent-color: var(--accent); transform: scale(1.1); pointer-events: none; }

    /* Inline Code */
    #md-output code:not(pre code) {
      font-family: 'JetBrains Mono', monospace; font-size: .83em;
      padding: .12rem .4rem; background: var(--bg-inline-code);
      border: 1px solid rgba(99,102,241,.08); border-radius: .3rem;
      color: var(--accent); font-weight: 500;
    }

    /* Code Blocks */
    #md-output pre {
      margin: 1.15rem 0; border-radius: .65rem; overflow: hidden;
      border: 1px solid var(--border-subtle); background: var(--bg-code);
      position: relative;
    }
    #md-output pre code {
      display: block; padding: 1.15rem 1.35rem;
      font-family: 'JetBrains Mono', monospace; font-size: .8rem;
      line-height: 1.65; overflow-x: auto; color: #c9d1d9; tab-size: 2;
    }
    .lang-tag {
      position: absolute; top: 0; right: 0;
      padding: .15rem .65rem; font-size: .6rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--text-muted); background: rgba(99,102,241,.06);
      border-bottom-left-radius: .45rem;
    }
    .cp-btn {
      position: absolute; top: .4rem; right: .4rem;
      padding: .25rem .55rem; background: rgba(99,102,241,.12);
      border: 1px solid var(--border-glass); border-radius: .35rem;
      color: var(--text-muted); font-size: .67rem; font-family: inherit;
      cursor: pointer; opacity: 0; transition: all .12s;
    }
    pre:hover .cp-btn { opacity: 1; }
    .cp-btn:hover { background: rgba(99,102,241,.25); color: var(--text-primary); }
    .cp-btn.ok { color: var(--green); border-color: var(--green); }

    /* Tables */
    #md-output .table-wrap { overflow-x: auto; margin: 1.15rem 0; border-radius: .65rem; border: 1px solid var(--border-subtle); }
    #md-output table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    #md-output thead { background: var(--bg-table-head); }
    #md-output th {
      padding: .6rem .9rem; text-align: left; font-weight: 700;
      font-size: .72rem; letter-spacing: .05em; text-transform: uppercase;
      color: var(--accent); border-bottom: 1px solid var(--border-glass);
    }
    #md-output td { padding: .55rem .9rem; border-bottom: 1px solid rgba(99,102,241,.05); vertical-align: top; }
    #md-output tbody tr:nth-child(even) { background: var(--bg-table-row); }
    #md-output tbody tr:hover { background: var(--bg-hover); }

    /* Blockquotes */
    #md-output blockquote {
      margin: 1.15rem 0; padding: .65rem 1.15rem;
      border-left: 3px solid var(--accent); background: var(--bg-blockquote);
      border-radius: 0 .45rem .45rem 0; color: var(--text-secondary);
    }
    #md-output blockquote blockquote { margin: .4rem 0 0; }

    /* GitHub Alerts */
    .alert { margin: 1.15rem 0; padding: .8rem 1.15rem; border-radius: .5rem; border-left: 4px solid; }
    .alert-note { background: rgba(56,132,255,.05); border-color: #3884ff; }
    .alert-tip { background: rgba(52,211,153,.05); border-color: var(--green); }
    .alert-important { background: rgba(167,139,250,.05); border-color: var(--purple); }
    .alert-warning { background: rgba(251,191,36,.05); border-color: var(--yellow); }
    .alert-caution { background: rgba(247,37,133,.05); border-color: var(--pink); }
    .alert-hd {
      font-weight: 700; font-size: .78rem; text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: .25rem;
      display: flex; align-items: center; gap: .35rem;
    }
    .alert-note .alert-hd { color: #3884ff; }
    .alert-tip .alert-hd { color: var(--green); }
    .alert-important .alert-hd { color: var(--purple); }
    .alert-warning .alert-hd { color: var(--yellow); }
    .alert-caution .alert-hd { color: var(--pink); }

    /* Images */
    #md-output img { max-width: 100%; border-radius: .65rem; border: 1px solid var(--border-subtle); margin: .75rem 0; }

    /* Diff */
    .diff-add { color: #3fb950; background: rgba(63,185,80,.08); display: block; }
    .diff-del { color: #f85149; background: rgba(248,81,73,.08); display: block; }

    /* ═══════════════════════════════════════════════════════════════
       SEARCH OVERLAY
       ═══════════════════════════════════════════════════════════════ */
    #search-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 500; display: none; align-items: flex-start; justify-content: center;
      padding-top: 18vh; backdrop-filter: blur(4px);
    }
    #search-overlay.open { display: flex; }
    .search-box {
      width: min(560px, 90vw); background: var(--bg-surface);
      border: 1px solid var(--border-glass); border-radius: .85rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden;
      animation: slideUp .2s ease both;
    }
    .search-input-wrap { padding: .75rem 1rem; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: .6rem; }
    .search-input-wrap span { color: var(--text-muted); font-size: 1.1rem; }
    #search-input {
      flex: 1; border: none; background: transparent; color: var(--text-primary);
      font-size: .95rem; font-family: inherit; outline: none;
    }
    #search-input::placeholder { color: var(--text-muted); }
    #search-results { max-height: 45vh; overflow-y: auto; padding: .5rem; }
    .search-result {
      display: block; padding: .55rem .85rem; border-radius: .45rem;
      font-size: .82rem; color: var(--text-secondary); cursor: pointer;
      transition: all .1s; text-decoration: none; border: none;
      background: none; width: 100%; text-align: left; font-family: inherit;
    }
    .search-result:hover, .search-result.selected { background: var(--accent-dim); color: var(--text-primary); }
    .search-result mark { background: rgba(251,191,36,.2); color: var(--yellow); border-radius: 2px; padding: 0 2px; }
    .search-empty { padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: .85rem; }

    /* ═══════════════════════════════════════════════════════════════
       SYNTAX HIGHLIGHTING
       ═══════════════════════════════════════════════════════════════ */
    .hl-kw { color: #ff7b72; }
    .hl-str { color: #a5d6ff; }
    .hl-num { color: #79c0ff; }
    .hl-cmt { color: #8b949e; font-style: italic; }
    .hl-fn { color: #d2a8ff; }
    .hl-type { color: #ffa657; }
    .hl-var { color: #79c0ff; }
    .hl-tag { color: #7ee787; }
    .hl-attr { color: #79c0ff; }
    .hl-lit { color: #79c0ff; }

    /* ═══════════════════════════════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════════════════════════════ */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes loadSlide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 960px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); box-shadow: 4px 0 30px rgba(0,0,0,.5); }
      #main { margin-left: 0 !important; padding: calc(var(--topbar-h) + 1rem) 1.15rem 3rem; }
      #topbar { left: 0 !important; }
      #md-output h1 { font-size: 1.5rem; }
      #md-output h2 { font-size: 1.2rem; }
    }
    @media (max-width: 600px) {
      #main { padding-left: .65rem; padding-right: .65rem; }

       PRINT

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURATION — เพิ่ม .md ไฟล์ได้ที่นี่
// ═══════════════════════════════════════════════════════════════════
const CONFIG = {
  // GitHub repository info (auto-detected from GitHub Pages URL as fallback)
  owner: 'AyaEmorin',
  repo: 'XO-Unbeatable-AI',
  branch: 'main',

  // Default document to load on startup
  defaultDoc: 'DOCS.md',

  // List of documents — เพิ่มไฟล์ .md ใหม่ได้ที่นี่
  docs: [
    { name: 'System Documentation', icon: '📖', file: 'DOCS.md' },
    { name: 'Product Requirements', icon: '📋', file: 'PRD.md' },
    { name: 'README', icon: '📄', file: 'README.md' },
  ],
};

// ═══════════════════════════════════════════════════════════════════
//  MARKDOWN PARSER
// ═══════════════════════════════════════════════════════════════════
const MD = (() => {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const slug = t => t.toLowerCase().replace(/[^\w\s\u0E00-\u0E7F-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');

  function inline(t) {
    t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy"/>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__(.+?)__/g, '<strong>$1</strong>');
    t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
    t = t.replace(/_([^_]+)_/g, '<em>$1</em>');
    t = t.replace(/~~(.+?)~~/g, '<del>$1</del>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  }

  function hlJS(c) {
    c = c.replace(/(\/\/.*)/g, '<span class="hl-cmt">$1</span>');
    c = c.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hl-cmt">$1</span>');
    c = c.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|'[^']*?')/g, '<span class="hl-str">$1</span>');
    c = c.replace(/(`[^`]*?`)/g, '<span class="hl-str">$1</span>');
    c = c.replace(/\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|this|class|extends|import|export|from|default|type|interface|enum|as|typeof|instanceof|in|of|async|await|try|catch|finally|throw|true|false|null|undefined|void|never|readonly|static|super|implements|abstract|declare|module|namespace|require|yield)\b/g, '<span class="hl-kw">$1</span>');
    c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="hl-num">$1</span>');
    c = c.replace(/\b(string|number|boolean|any|object|Array|Map|Set|Promise|Record|Partial|Required|Readonly|Pick|Omit|React|HTMLElement|Event|Error)\b/g, '<span class="hl-type">$1</span>');
    return c;
  }
  function hlCSS(c) {
    c = c.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hl-cmt">$1</span>');
    c = c.replace(/(#[\da-fA-F]{3,8})\b/g, '<span class="hl-num">$1</span>');
    c = c.replace(/(\d+\.?\d*(?:px|rem|em|%|vh|vw|ms|s|deg))/g, '<span class="hl-num">$1</span>');
    c = c.replace(/(--[\w-]+)/g, '<span class="hl-var">$1</span>');
    return c;
  }
  function hlHTML(c) {
    c = c.replace(/(&lt;\/?[\w-]+)/g, '<span class="hl-tag">$1</span>');
    c = c.replace(/(\w+)=/g, '<span class="hl-attr">$1</span>=');
    c = c.replace(/(&quot;[^&]*?&quot;)/g, '<span class="hl-str">$1</span>');
    return c;
  }
  function hlBash(c) {
    c = c.replace(/(#.*)/g, '<span class="hl-cmt">$1</span>');
    c = c.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="hl-str">$1</span>');
    c = c.replace(/\b(npm|npx|node|git|cd|ls|mkdir|rm|cp|mv|echo|export|curl|wget|sudo|yarn|pnpm|vitest|vite|tsc|wrangler|serve|pip|python|docker|make|go|cargo)\b/g, '<span class="hl-kw">$1</span>');
    return c;
  }
  function hlPy(c) {
    c = c.replace(/(#.*)/g, '<span class="hl-cmt">$1</span>');
    c = c.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="hl-str">$1</span>');
    c = c.replace(/\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|lambda|yield|pass|break|continue|raise|True|False|None|and|or|not|in|is|self|async|await)\b/g, '<span class="hl-kw">$1</span>');
    c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="hl-num">$1</span>');
    return c;
  }
  function hlJSON(c) {
    c = c.replace(/(&quot;[^&]*?&quot;)\s*:/g, '<span class="hl-attr">$1</span>:');
    c = c.replace(/:\s*(&quot;[^&]*?&quot;)/g, ': <span class="hl-str">$1</span>');
    c = c.replace(/\b(true|false|null)\b/g, '<span class="hl-lit">$1</span>');
    c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="hl-num">$1</span>');
    return c;
  }

  function codeBlock(raw, lang) {
    let c = esc(raw);
    if (lang === 'diff') {
      c = c.split('\n').map(l => {
        if (l.startsWith('+')) return `<span class="diff-add">${l}</span>`;
        if (l.startsWith('-')) return `<span class="diff-del">${l}</span>`;
        return l;
      }).join('\n');
    } else if (/^(typescript|ts|javascript|js|jsx|tsx)$/.test(lang)) c = hlJS(c);
    else if (/^(css|scss|less)$/.test(lang)) c = hlCSS(c);
    else if (/^(html|xml|svg)$/.test(lang)) c = hlHTML(c);
    else if (/^(bash|sh|shell|zsh)$/.test(lang)) c = hlBash(c);
    else if (/^(python|py)$/.test(lang)) c = hlPy(c);
    else if (lang === 'json') c = hlJSON(c);
    const tag = lang ? `<span class="lang-tag">${esc(lang)}</span>` : '';
    return `<pre>${tag}<button class="cp-btn" onclick="cpCode(this)">Copy</button><code>${c}</code></pre>`;
  }

  function parse(md) {
    const L = md.split('\n');
    let h = '', i = 0;
    while (i < L.length) {
      const l = L[i];
      // Fenced code
      const cm = l.match(/^(`{3,4})([\w+-]*)/);
      if (cm) {
        const fence = cm[1]; const lang = cm[2]; let code = ''; i++;
        while (i < L.length && !L[i].startsWith(fence)) { code += (code ? '\n' : '') + L[i]; i++; }
        i++; h += codeBlock(code, lang); continue;
      }
      // HR
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { h += '<hr/>'; i++; continue; }
      // Headings
      const hm = l.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        const lv = hm[1].length;
        const txt = hm[2].replace(/\s+#*$/, '');
        const sl = slug(txt.replace(/<[^>]+>/g, '').replace(/[`*_~\[\]()]/g, ''));
        h += `<h${lv} id="${sl}">${inline(txt)}<a class="h-anchor" href="#${sl}">#</a></h${lv}>`;
        i++; continue;
      }
      // Alerts
      const am = l.match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
      if (am) {
        const at = am[1].toLowerCase();
        const icons = {note:'ℹ️',tip:'💡',important:'❗',warning:'⚠️',caution:'🔴'};
        let c = ''; i++;
        while (i < L.length && L[i].startsWith('>')) { c += (c ? '\n' : '') + L[i].replace(/^>\s?/, ''); i++; }
        h += `<div class="alert alert-${at}"><div class="alert-hd">${icons[at]} ${at}</div><div>${inline(c)}</div></div>`;
        continue;
      }
      // Blockquote
      if (l.startsWith('>')) {
        let bq = ''; while (i < L.length && L[i].startsWith('>')) { bq += (bq ? '\n' : '') + L[i].replace(/^>\s?/, ''); i++; }
        h += `<blockquote>${parse(bq)}</blockquote>`; continue;
      }
      // Table
      if (l.includes('|') && i+1 < L.length && /^\s*\|?\s*[-:]+/.test(L[i+1])) {
        const hCells = l.split('|').map(c=>c.trim()).filter(Boolean);
        const aligns = L[i+1].split('|').map(c=>c.trim()).filter(Boolean).map(c => {
          if (c.startsWith(':') && c.endsWith(':')) return 'center';
          if (c.endsWith(':')) return 'right'; return 'left';
        });
        let t = '<div class="table-wrap"><table><thead><tr>';
        hCells.forEach((c,ci)=>{ t += `<th style="text-align:${aligns[ci]||'left'}">${inline(c)}</th>`; });
        t += '</tr></thead><tbody>'; i += 2;
        while (i < L.length && L[i].includes('|')) {
          const cells = L[i].split('|').map(c=>c.trim()).filter(Boolean);
          t += '<tr>';
          cells.forEach((c,ci)=>{ t += `<td style="text-align:${aligns[ci]||'left'}">${inline(c)}</td>`; });
          t += '</tr>'; i++;
        }
        t += '</tbody></table></div>'; h += t; continue;
      }
      // UL
      if (/^\s*[-*+]\s/.test(l)) {
        let ul = '<ul>';
        while (i < L.length && /^\s*[-*+]\s/.test(L[i])) {
          let txt = L[i].replace(/^\s*[-*+]\s/, ''); let cb = '';
          if (/^\[([ xX/])\]\s/.test(txt)) {
            cb = `<input type="checkbox" disabled ${txt[1]!==' '?'checked':''}/>`; txt = txt.slice(4);
          }
          ul += `<li>${cb}${inline(txt)}</li>`; i++;
        }
        h += ul + '</ul>'; continue;
      }
      // OL
      if (/^\s*\d+\.\s/.test(l)) {
        let ol = '<ol>';
        while (i < L.length && /^\s*\d+\.\s/.test(L[i])) {
          ol += `<li>${inline(L[i].replace(/^\s*\d+\.\s/, ''))}</li>`; i++;
        }
        h += ol + '</ol>'; continue;
      }
      // Blank
      if (l.trim() === '') { i++; continue; }
      // Paragraph
      let p = l; i++;
      while (i < L.length && L[i].trim() !== '' && !L[i].match(/^(#{1,6}\s|`{3}|---|[*_]{3,}|>\s|\||\s*[-*+]\s|\s*\d+\.\s)/)) {
        p += '\n' + L[i]; i++;
      }
      h += `<p>${inline(p)}</p>`;
    }
    return h;
  }

  function headings(md) {
    const res = []; const L = md.split('\n'); let inCode = false;
    for (const l of L) {
      if (l.startsWith('```')) { inCode = !inCode; continue; }
      if (inCode) continue;
      const m = l.match(/^(#{1,6})\s+(.+)$/);
      if (m) {
        const t = m[2].replace(/\s+#*$/, '').replace(/<[^>]+>/g, '').replace(/[`*_~\[\]()]/g, '');
        res.push({ level: m[1].length, text: t, slug: slug(t) });
      }
    }
    return res;
  }

  return { parse, headings };
})();

// ═══════════════════════════════════════════════════════════════════
//  DOM REFS
// ═══════════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const sidebar  = $('#sidebar'),    backdrop = $('#sidebar-backdrop');
const topbar   = $('#topbar'),     main     = $('#main');
const welcome  = $('#welcome'),    output   = $('#md-output');
const tocList  = $('#toc-list'),   docList  = $('#doc-list');
const curFile  = $('#current-file');
const loader   = $('#loader');
const filePicker = $('#file-picker');
const searchOverlay = $('#search-overlay');
const searchInput   = $('#search-input');
const searchResults = $('#search-results');

let sidebarOpen = window.innerWidth > 960;
let currentRawMd = '';
let currentHeadings = [];
let userDocs = []; // user-added files

// ═══════════════════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════════════════
function updateSidebar() {
  if (sidebarOpen) {
    sidebar.classList.remove('closed');
    if (window.innerWidth <= 960) { sidebar.classList.add('open'); backdrop.classList.add('show'); }
    else { sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
    main.classList.remove('full'); topbar.classList.remove('full');
  } else {
    sidebar.classList.add('closed'); sidebar.classList.remove('open');
    backdrop.classList.remove('show');
    main.classList.add('full'); topbar.classList.add('full');
  }
}

function toggleSidebar() { sidebarOpen = !sidebarOpen; updateSidebar(); }

$('#menu-btn').onclick = toggleSidebar;
backdrop.onclick = () => { sidebarOpen = false; updateSidebar(); };

// Mobile: start closed
if (window.innerWidth <= 960) { sidebarOpen = false; }
updateSidebar();

// ═══════════════════════════════════════════════════════════════════
//  DOC LIST
// ═══════════════════════════════════════════════════════════════════
let activeDocFile = null;

function renderDocList() {
  docList.innerHTML = '';
  const allDocs = [...CONFIG.docs, ...userDocs];
  allDocs.forEach(doc => {
    const btn = document.createElement('button');
    btn.className = 'doc-item' + (activeDocFile === doc.file ? ' active' : '');
    btn.innerHTML = `<span class="doc-item-icon">${doc.icon || '📄'}</span><span class="doc-item-name">${doc.name}</span>`;
    btn.onclick = () => loadDoc(doc.file, doc.name);
    docList.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════════════════
//  FETCH DOCUMENT
// ═══════════════════════════════════════════════════════════════════
async function fetchFile(filename) {
  // 1. Try relative path (same dir — works if .md files are in docs/)
  try {
    const r = await fetch('./' + filename);
    if (r.ok) return await r.text();
  } catch {}

  // 2. Try parent dir (local dev — docs/../DOCS.md)
  try {
    const r = await fetch('../' + filename);
    if (r.ok) return await r.text();
  } catch {}

  // 3. Auto-detect GitHub info from Pages URL
  let owner = CONFIG.owner, repo = CONFIG.repo, branch = CONFIG.branch;
  const ghMatch = location.href.match(/https?:\/\/([^.]+)\.github\.io\/([^/]+)/);
  if (ghMatch) { owner = ghMatch[1]; repo = ghMatch[2]; }

  // 4. Try GitHub raw content
  if (owner && repo) {
    try {
      const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filename}`;
      const r = await fetch(url);
      if (r.ok) return await r.text();
    } catch {}
  }

  return null;
}

// ═══════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════
function render(md, filename) {
  currentRawMd = md;
  output.innerHTML = MD.parse(md);
  output.style.display = 'block';
  welcome.style.display = 'none';
  curFile.textContent = filename;
  document.title = `${filename} — XO Docs`;

  // TOC
  currentHeadings = MD.headings(md);
  tocList.innerHTML = '';
  currentHeadings.forEach(h => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + h.slug; a.textContent = h.text;
    a.setAttribute('data-level', h.level);
    a.onclick = e => {
      e.preventDefault();
      const el = document.getElementById(h.slug);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (window.innerWidth <= 960 && sidebarOpen) toggleSidebar();
    };
    li.appendChild(a); tocList.appendChild(li);
  });

  // Open sidebar if has TOC and desktop
  if (currentHeadings.length > 0 && window.innerWidth > 960 && !sidebarOpen) toggleSidebar();

  setupScrollSpy();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

async function loadDoc(filename, displayName) {
  loader.classList.add('show');
  activeDocFile = filename;
  renderDocList();
  const md = await fetchFile(filename);
  loader.classList.remove('show');
  if (md) {
    render(md, displayName || filename);
  } else {
    output.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--text-muted);">
      <p style="font-size:2rem;margin-bottom:.5rem;">😕</p>
      <p>ไม่สามารถโหลด <strong>${filename}</strong> ได้</p>
      <p style="font-size:.82rem;margin-top:.5rem;">ตรวจสอบว่าไฟล์อยู่ใน repository หรือลอง drag-and-drop ไฟล์โดยตรง</p>
    </div>`;
    output.style.display = 'block';
    welcome.style.display = 'none';
    curFile.textContent = filename;
  }
}

function loadLocalFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const name = file.name;
    // Add to user docs if not already there
    if (!userDocs.find(d => d.file === name) && !CONFIG.docs.find(d => d.file === name)) {
      userDocs.push({ name: name.replace(/\.md$/i, ''), icon: '📎', file: name });
    }
    activeDocFile = name;
    renderDocList();
    render(e.target.result, name);
  };
  reader.readAsText(file, 'UTF-8');
}

// ═══════════════════════════════════════════════════════════════════
//  SCROLL SPY
// ═══════════════════════════════════════════════════════════════════
function setupScrollSpy() {
  const links = tocList.querySelectorAll('a');
  if (!links.length) return;
  const els = Array.from(links).map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  let ticking = false;
  const onScroll = () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      let idx = 0; const y = window.scrollY + 90;
      els.forEach((el, i) => { if (el.offsetTop <= y) idx = i; });
      links.forEach((a, i) => a.classList.toggle('active', i === idx));
      ticking = false;
    });
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

// ═══════════════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════════════
function openSearch() { searchOverlay.classList.add('open'); searchInput.value = ''; searchInput.focus(); doSearch(''); }
function closeSearch() { searchOverlay.classList.remove('open'); }

$('#search-btn').onclick = openSearch;
searchOverlay.onclick = e => { if (e.target === searchOverlay) closeSearch(); };

searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if (e.key === 'Enter') {
    const sel = searchResults.querySelector('.selected') || searchResults.querySelector('.search-result');
    if (sel) { sel.click(); closeSearch(); }
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = searchResults.querySelectorAll('.search-result');
    let idx = Array.from(items).findIndex(el => el.classList.contains('selected'));
    items.forEach(el => el.classList.remove('selected'));
    if (e.key === 'ArrowDown') idx = Math.min(idx + 1, items.length - 1);
    else idx = Math.max(idx - 1, 0);
    if (items[idx]) { items[idx].classList.add('selected'); items[idx].scrollIntoView({ block: 'nearest' }); }
  }
});

function doSearch(q) {
  if (!q.trim()) {
    searchResults.innerHTML = currentHeadings.length
      ? currentHeadings.map(h => `<button class="search-result" data-slug="${h.slug}">${'　'.repeat(h.level-1)}${h.text}</button>`).join('')
      : '<div class="search-empty">โหลดเอกสารก่อนเพื่อค้นหา</div>';
    bindSearchResults();
    return;
  }
  const lq = q.toLowerCase();
  const matches = currentHeadings.filter(h => h.text.toLowerCase().includes(lq));
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="search-empty">ไม่พบผลลัพธ์</div>';
    return;
  }
  searchResults.innerHTML = matches.map(h => {
    const highlighted = h.text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
    return `<button class="search-result" data-slug="${h.slug}">${highlighted}</button>`;
  }).join('');
  bindSearchResults();
}

function bindSearchResults() {
  searchResults.querySelectorAll('.search-result').forEach(btn => {
    btn.onclick = () => {
      const el = document.getElementById(btn.dataset.slug);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      closeSearch();
    };
  });
}

// ═══════════════════════════════════════════════════════════════════
//  FILE EVENTS
// ═══════════════════════════════════════════════════════════════════
filePicker.onchange = e => { if (e.target.files[0]) loadLocalFile(e.target.files[0]); };
$('#drop-card').onclick = () => filePicker.click();
$('#sidebar-open-btn').onclick = () => filePicker.click();

document.addEventListener('dragover', e => { e.preventDefault(); $('#drop-card')?.classList.add('dragover'); });
document.addEventListener('dragleave', e => { if (!document.contains(e.relatedTarget)) $('#drop-card')?.classList.remove('dragover'); });
document.addEventListener('drop', e => {
  e.preventDefault(); $('#drop-card')?.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadLocalFile(e.dataTransfer.files[0]);
});

// ═══════════════════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 'o') { e.preventDefault(); filePicker.click(); }
  if (mod && e.key === 'b') { e.preventDefault(); toggleSidebar(); }
  if (mod && e.key === 'k') { e.preventDefault(); openSearch(); }
  if (mod && e.key === 'p') { e.preventDefault(); window.print(); }
  if (e.key === 'Escape' && searchOverlay.classList.contains('open')) closeSearch();
});

// Copy code
window.cpCode = btn => {
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copied'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
  });
};

// Print
$('#print-btn').onclick = () => window.print();

// ═══════════════════════════════════════════════════════════════════
//  STARTUP — Auto-load default document
// ═══════════════════════════════════════════════════════════════════
renderDocList();

// Check URL params: ?file=DOCS.md
const urlParams = new URLSearchParams(location.search);
const fileParam = urlParams.get('file');

if (fileParam) {
  const doc = CONFIG.docs.find(d => d.file === fileParam);
  loadDoc(fileParam, doc?.name || fileParam);
} else if (CONFIG.defaultDoc) {
  const doc = CONFIG.docs.find(d => d.file === CONFIG.defaultDoc);
  loadDoc(CONFIG.defaultDoc, doc?.name || CONFIG.defaultDoc);
}
</script>
</body>
